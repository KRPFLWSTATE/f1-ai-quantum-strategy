[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f1q"
version = "0.3.0"
description = "Stage 3 local infrastructure for deadline-constrained Formula 1 AI and quantum strategy research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Kawin Rehan Perera" }]
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
f1q = "f1q.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
