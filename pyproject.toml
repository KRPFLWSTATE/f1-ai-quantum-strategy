[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "f1q"
version = "0.8.0"
description = "A4 checkpoint candidate-generation benchmark plus preserved A2/A3 lineage for Formula 1 AI/quantum strategy research"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "Kawin Rehan Perera" }]
dependencies = [
    "pydantic>=2.9,<3",
    "PyYAML>=6.0.2,<7",
    "numpy>=2.0,<3",
    "scipy>=1.14,<2",
    "qiskit>=1.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
f1q = "f1q.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
